services:
  # Caddy — reverse proxy + auto-TLS via Let's Encrypt.
  # Only starts when `--profile domain` is active (setup.sh chooses
  # the profile based on whether the user has a domain).
  # Routes:
  #   ${EDITOR_FQDN}  → editor:3001
  #   ${API_FQDN}     → api:3000
  # Caddyfile is generated by setup.sh from Caddyfile.template.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - editor
      - api
    networks:
      - astradial

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-astradial}
      MARIADB_DATABASE: ${DB_NAME:-astradial}
      MARIADB_USER: ${DB_USER:-astradial}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Bind to 127.0.0.1 ONLY. Docker's iptables rules bypass UFW
      # (https://docs.docker.com/network/iptables/), so anything mapped
      # to 0.0.0.0 is reachable from the public internet even when ufw
      # says it isn't. Internet-scanning ransomware groups regularly
      # brute-force MariaDB/MySQL/PG/Redis on common ports — Skylink's
      # OSS deployment was hit in 2026-05 when this was 0.0.0.0:3307.
      # Other containers reach this via the docker network as `mariadb`
      # regardless.
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astradial

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # 127.0.0.1 only — same reasoning as mariadb. Redis without a
      # password on a public IP is a known attacker target (RCE via
      # CONFIG SET dir + write SSH keys).
      - "127.0.0.1:6379:6379"
    networks:
      - astradial

  # PostgreSQL — backs workflow-engine only. The astrapbx api uses
  # mariadb; we run both because the workflow service was originally
  # written against Postgres and ports cleanly. Self-bootstraps its
  # tables on first boot via workflow-engine/src/db.js.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-workflow_db}
      POSTGRES_USER: ${PG_USER:-workflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-workflow_secure}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-workflow} -d ${PG_DATABASE:-workflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astradial

  # api + asterisk in one container. The image installs both `asterisk`
  # and `node` and runs them under supervisord. This mirrors platform's
  # bare-metal VPS topology (PM2-node + system asterisk co-located), so
  # every src/services/asterisk/*.js call to `asterisk -rx ...` works
  # without modification — asterisk is always on localhost from node's
  # perspective.
  api:
    build: ./api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # HTTP api
      - "8000:3000"
      # SIP signalling (UDP + TCP)
      - "5060:5060/udp"
      - "5060:5060/tcp"
      # RTP media
      - "10000-10100:10000-10100/udp"
    environment:
      - HOST=0.0.0.0
      - SIP_HOST=${SIP_HOST:-}
      - SIP_PORT=${SIP_PORT:-5060}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-astradial}
      - DB_USER=${DB_USER:-astradial}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_DIALECT=mariadb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_API_PASSWORD=${ADMIN_API_PASSWORD:-admin}
      # Asterisk is co-located in this container — AMI and ARI on 127.0.0.1.
      - ASTERISK_HOST=127.0.0.1
      - AMI_HOST=127.0.0.1
      - AMI_PORT=5038
      - AMI_USERNAME=astradial
      - AMI_SECRET=${ASTERISK_AMI_SECRET:-astradial}
      - ASTERISK_PORT=8088
      - ASTERISK_ARI_USERNAME=astradial
      - ASTERISK_ARI_PASSWORD=${ASTERISK_AMI_SECRET:-astradial}
      - ASTERISK_ARI_APP=pbx_api
      - ASTERISK_AMI_PORT=5038
      - ASTERISK_AMI_USER=astradial
      - ASTERISK_AMI_SECRET=${ASTERISK_AMI_SECRET:-astradial}
      - ASTERISK_AMI_SECRET_VALUE=${ASTERISK_AMI_SECRET:-astradial}
      - ASTERISK_PJSIP_CONFIG_PATH=/etc/asterisk
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-dev-key}
      - ASTRADIAL_MODE=${ASTRADIAL_MODE:-selfhosted}
      - ASTRADIAL_TRUNK_HOST=${ASTRADIAL_TRUNK_HOST:-}
      - ASTRADIAL_TRUNK_USER=${ASTRADIAL_TRUNK_USER:-}
      - ASTRADIAL_TRUNK_PASS=${ASTRADIAL_TRUNK_PASS:-}
      # Auth provider: 'true' = Firebase mode (requires GOOGLE_APPLICATION_CREDENTIALS),
      # anything else = local mode (api_key + api_secret via /api/v1/auth/login).
      - USE_FIREBASE=${USE_FIREBASE:-false}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_recordings:/var/spool/asterisk/monitor
    networks:
      - astradial

  editor:
    build:
      context: ./editor
      args:
        PBX_URL: ${NEXT_PUBLIC_PBX_URL:-http://api:3000}
        WORKFLOW_URL: ${NEXT_PUBLIC_WORKFLOW_URL:-http://workflow-engine:3002}
        GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://pipecat-flow:7860}
        ASTRADIAL_MODE: ${ASTRADIAL_MODE:-selfhosted}
        # NEXT_PUBLIC_USE_FIREBASE must be set at BUILD time — Next.js
        # bakes NEXT_PUBLIC_* into the static bundle. Default 'false' =
        # OSS local mode (the OssLoginForm renders, api_key + api_secret).
        NEXT_PUBLIC_USE_FIREBASE: ${NEXT_PUBLIC_USE_FIREBASE:-false}
        # SIP host advertised to softphone provisioning QR. setup.sh
        # passes the actual host; falls through to runtime derivation
        # from window.location when unset.
        NEXT_PUBLIC_SIP_HOST: ${SIP_HOST:-}
        NEXT_PUBLIC_SIP_PORT: ${SIP_PORT:-5060}
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_ASTRADIAL_MODE=${ASTRADIAL_MODE:-selfhosted}
      - NEXT_PUBLIC_USE_FIREBASE=${NEXT_PUBLIC_USE_FIREBASE:-false}
      - NEXT_PUBLIC_GATEWAY_URL=http://pipecat-flow:7860
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-dev-key}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - GATEWAY_ADMIN_KEY=${INTERNAL_API_KEY:-internal-dev-key}
    networks:
      - astradial
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  workflow-engine:
    build: ./workflow-engine
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-dev-key}
      - PORT=3002
      # Workflow service uses Postgres (separate from the astrapbx mariadb)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-workflow}
      - PG_PASSWORD=${PG_PASSWORD:-workflow_secure}
      - PG_DATABASE=${PG_DATABASE:-workflow_db}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - astradial

  pipecat-flow:
    build: ./pipecat-flow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=7860
      - GATEWAY_ADMIN_KEY=${INTERNAL_API_KEY:-internal-dev-key}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=${DB_USER:-astradial}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-astradial}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-dev-key}
      - ASTRAPBX_URL=http://api:3000
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - astradial

volumes:
  mariadb_data:
  postgres_data:
  asterisk_config:
  asterisk_recordings:
  caddy_data:
  caddy_config:

networks:
  astradial:
    driver: bridge
