; RTP port range — MUST match the UDP port range forwarded by
; docker-compose.yml (10000-10100). Asterisk picks RTP ports randomly
; in [rtpstart, rtpend]. If a port outside the docker forward gets
; picked, NAT'd RTP packets are dropped and the call has no audio.
;
; If you change this, update docker-compose.yml's api ports
; in lockstep.

[general]
rtpstart=10000
rtpend=10100

; Enable strict RTP source validation. Keeps spoofed RTP streams out.
strictrtp=yes
