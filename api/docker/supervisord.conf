; Supervisor program definitions for the single-container OSS image.
; Loaded via /etc/supervisor/conf.d/astradial.conf (Debian default).
;
; Both processes run as root because:
;  - asterisk binds the priv ports 5060/5038 and needs /var/run/asterisk
;  - node binds 3000 and reads/writes /etc/asterisk via the deploy service
; This matches platform's `systemctl start asterisk` topology where
; asterisk also runs as root by default.

[program:asterisk]
command=/usr/sbin/asterisk -f -vvv
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node src/server.js
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=20
environment=HOST="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
